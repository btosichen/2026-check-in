<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8b7cff">
  <title>臺北市立陽明高中線上簽到網頁</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff5a8,#ffd4e9 50%,#bef6ff);font-family:Arial,"Microsoft JhengHei",sans-serif;color:#40345c}.page{min-height:100vh;display:grid;place-items:center;padding:26px 16px 42px;position:relative;overflow:hidden}.blob{position:fixed;border-radius:50%;filter:blur(24px);opacity:.38}.b1{width:190px;height:190px;background:#ff70af;left:-70px;top:70px}.b2{width:230px;height:230px;background:#30d9eb;right:-90px;bottom:30px}.card{position:relative;width:min(100%,440px);overflow:hidden;border:4px solid #fff;border-radius:34px;background:#fffffff2;box-shadow:0 24px 0 #6a57b029,0 34px 80px #59479533}.stripe{height:12px;background:linear-gradient(90deg,#ff5fa5,#ffc83d,#32d7e7,#8b7cff)}.hero{height:218px;position:relative;overflow:hidden;padding:26px 26px;background:radial-gradient(circle at 20% 20%,#fff 0 3px,transparent 4px),linear-gradient(135deg,#50ddeb,#8b7cff 58%,#ff7fb8);background-size:27px 27px,auto;color:#fff}.mascot{position:absolute;width:200px;right:-28px;bottom:-35px;filter:drop-shadow(0 8px 0 #4a388429)}.copy{position:relative;z-index:1;width:62%}.status{display:inline-block;border:2px solid #ffffffcc;border-radius:999px;padding:7px 12px;background:#ffad32;font-size:14px;font-weight:900}.eyebrow{margin:24px 0 3px;font-size:14px;font-weight:900;letter-spacing:.12em}.hero h1{margin:0;font-size:34px;line-height:1.15;text-shadow:0 2px #6651ad55}.hero p{margin:9px 0 0;font-size:14px;font-weight:800;line-height:1.5}.time{display:flex;gap:9px;margin:0 24px;padding:13px 15px;border:2px solid #ffe078;border-radius:17px;background:#fff9cd;color:#765723;font-size:14px;font-weight:800;line-height:1.5}.time b{font-size:19px;color:#ff9731}.form{padding:24px 26px 30px}.label{display:block;margin:0 0 8px;font-size:15px;font-weight:900;color:#5a4b79}.input{width:100%;height:56px;margin-bottom:19px;padding:0 16px;border:2px solid #e5dcff;border-radius:17px;background:#fcfbff;font-size:16px;outline:none}.input:focus{border-color:#8b7cff;box-shadow:0 0 0 4px #8b7cff22}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:19px}.roles input{position:absolute;opacity:0}.roles span{display:grid;place-items:center;height:54px;border:2px solid #ffb5d2;border-radius:17px;background:#fff0f7;color:#d84988;font-weight:900;cursor:pointer}.roles label+label span{border-color:#95eaf3;background:#eefdff;color:#168b9a}.roles input:checked+span{transform:translateY(-2px);border-color:#8b7cff;box-shadow:0 6px 14px #6651ad22}.hint{margin:-11px 0 0;color:#817495;font-size:13px}.submit{width:100%;height:58px;margin-top:25px;border:0;border-radius:17px;background:linear-gradient(90deg,#ff5fa5,#8b7cff,#27cadb);box-shadow:0 8px 0 #6651ad,0 14px 28px #6651ad40;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.submit:disabled{background:#cbd0d8;box-shadow:0 6px 0 #969da7;cursor:not-allowed}.notice{display:none;margin:18px 0 0;padding:12px 14px;border-radius:14px;background:#fff0f2;color:#c43168;font-size:14px;font-weight:800}.privacy{text-align:center;margin:27px 0 0;font-size:12px;font-weight:800;color:#685a7a}@media(max-width:400px){.hero{height:205px;padding:22px}.mascot{width:178px}.hero h1{font-size:30px}.form{padding:22px}.time{margin:0 20px}}
  </style>
</head>
<body><main class="page"><i class="blob b1"></i><i class="blob b2"></i><section class="card"><div class="stripe"></div><header class="hero"><img class="mascot" src="public/checkin-fox.png" alt="可愛狐狸報到吉祥物"><div class="copy"><span class="status" id="status">正在確認時間</span><p class="eyebrow" id="eventName">914 緊急救護組</p><h1>現場報到</h1><p>填寫三項資料，快速完成簽到！</p></div></header><div class="time"><b>◷</b><span id="windowText">讀取活動時間中…<br>送出時自動記錄時間</span></div><form class="form" id="checkinForm" method="post"><label class="label" for="name">姓名</label><input class="input" id="name" name="name" autocomplete="name" required minlength="2" maxlength="40" placeholder="請輸入真實姓名"><fieldset style="border:0;padding:0;margin:0"><legend class="label">身分</legend><div class="roles"><label><input type="radio" name="role" value="教師" required><span>教師</span></label><label><input type="radio" name="role" value="職員" required><span>職員</span></label></div></fieldset><label class="label" for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com"><p class="hint">Email 僅用於辨識是否重複報到。</p><p class="notice" id="notice"></p><button class="submit" id="submitButton" type="submit" disabled>尚未連接 GAS</button></form></section><p class="privacy">個人資料僅供本次活動出席紀錄使用</p></main>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyVg01lVHXtkQeJ-LwWNN1WuLV650pOF4RUahwo0Fu6VmVrVwOXdiyYwQXwC9r1N5vVyg/exec";
  const form=document.getElementById('checkinForm'),button=document.getElementById('submitButton'),notice=document.getElementById('notice'),statusEl=document.getElementById('status');
  window.receiveCheckinConfig=function(c){if(!c.ok){showError(c.error||'無法讀取活動設定');return}document.getElementById('eventName').textContent=c.eventName;const start=new Date(c.startAt),end=new Date(c.endAt),server=new Date(c.serverTime);document.getElementById('windowText').innerHTML=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(start)+'－'+new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}).format(end)+'<br>送出時自動記錄時間';if(server<start){statusEl.textContent='報到尚未開始';button.textContent='報到尚未開始';button.disabled=true}else if(server>end){statusEl.textContent='報到已截止';button.textContent='報到已截止';button.disabled=true}else{statusEl.textContent='開放報到中';statusEl.style.background='#24c996';button.textContent='確認報到 ✦';button.disabled=false}};
  function showError(message){notice.textContent=message;notice.style.display='block';statusEl.textContent='尚未完成設定'}
  if(GAS_URL.startsWith('https://script.google.com/macros/s/')){form.action=GAS_URL;const s=document.createElement('script');s.src=GAS_URL+'?callback=receiveCheckinConfig';s.onerror=()=>showError('無法連接 Google Apps Script');document.head.appendChild(s)}else showError('請先把 index.html 裡的 GAS_URL 換成 Apps Script 網頁應用程式網址。');
</script></body></html>

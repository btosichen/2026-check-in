<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#092f4f">
  <title>臺北市立陽明高中線上簽到網頁</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff5a8,#ffd4e9 50%,#bef6ff);font-family:Arial,"Microsoft JhengHei",sans-serif;color:#40345c}.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 42px;position:relative;overflow:hidden}.blob{position:fixed;border-radius:50%;filter:blur(24px);opacity:.38}.b1{width:190px;height:190px;background:#ff70af;left:-70px;top:70px}.b2{width:230px;height:230px;background:#30d9eb;right:-90px;bottom:30px}.card{position:relative;width:min(100%,440px);overflow:hidden;border:4px solid #fff;border-radius:34px;background:#fffffff2;box-shadow:0 24px 0 #6a57b029,0 34px 80px #59479533}.stripe{height:12px;background:linear-gradient(90deg,#ff5fa5,#ffc83d,#32d7e7,#8b7cff)}.hero{height:218px;position:relative;overflow:hidden;padding:26px 26px;background:radial-gradient(circle at 20% 20%,#fff 0 3px,transparent 4px),linear-gradient(135deg,#50ddeb,#8b7cff 58%,#ff7fb8);background-size:27px 27px,auto;color:#fff}.mascot{position:absolute;width:200px;right:-28px;bottom:-35px;filter:drop-shadow(0 8px 0 #4a388429)}.copy{position:relative;z-index:1;width:62%}.status{display:inline-block;border:2px solid #ffffffcc;border-radius:999px;padding:7px 12px;background:#ffad32;font-size:14px;font-weight:900}.eyebrow{margin:24px 0 3px;font-size:14px;font-weight:900;letter-spacing:.12em}.hero h1{margin:0;font-size:34px;line-height:1.15;text-shadow:0 2px #6651ad55}.hero p{margin:9px 0 0;font-size:14px;font-weight:800;line-height:1.5}.time{display:flex;gap:9px;margin:0 24px;padding:13px 15px;border:2px solid #ffe078;border-radius:17px;background:#fff9cd;color:#765723;font-size:14px;font-weight:800;line-height:1.5}.time b{font-size:19px;color:#ff9731}.form{padding:24px 26px 30px}.label{display:block;margin:0 0 8px;font-size:15px;font-weight:900;color:#5a4b79}.input{width:100%;height:56px;margin-bottom:19px;padding:0 16px;border:2px solid #e5dcff;border-radius:17px;background:#fcfbff;font-size:16px;outline:none}.input:focus{border-color:#8b7cff;box-shadow:0 0 0 4px #8b7cff22}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:19px}.roles input{position:absolute;opacity:0}.roles span{display:grid;place-items:center;min-height:54px;padding:8px;border:2px solid #d9d0ff;border-radius:17px;background:#f7f4ff;color:#5b4aa0;font-weight:900;text-align:center;cursor:pointer}.roles label:first-child span{border-color:#ffb5d2;background:#fff0f7;color:#d84988}.roles label:last-child span{border-color:#95eaf3;background:#eefdff;color:#168b9a}.roles input:checked+span{transform:translateY(-2px);border-color:#8b7cff;background:#eeeaff;box-shadow:0 6px 14px #6651ad22}.team-select{width:100%;height:60px;margin-bottom:19px;padding:0 48px 0 16px;border:2px solid #d9d0ff;border-radius:17px;background:#f7f4ff;color:#40345c;font-size:17px;font-weight:800;outline:none;cursor:pointer}.team-select:focus{border-color:#8b7cff;box-shadow:0 0 0 4px #8b7cff22}.hint{margin:-11px 0 0;color:#817495;font-size:13px}.submit{width:100%;height:58px;margin-top:25px;border:0;border-radius:17px;background:linear-gradient(90deg,#ff5fa5,#8b7cff,#27cadb);box-shadow:0 8px 0 #6651ad,0 14px 28px #6651ad40;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.submit:disabled{background:#cbd0d8;box-shadow:0 6px 0 #969da7;cursor:not-allowed}.notice{display:none;margin:18px 0 0;padding:12px 14px;border-radius:14px;background:#fff0f2;color:#c43168;font-size:14px;font-weight:800}.attendance{position:relative;width:min(100%,440px);margin-top:34px;padding:20px;border:3px solid #fff;border-radius:26px;background:#fffffff0;box-shadow:0 12px 28px #15395724}.attendance-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.attendance h2{margin:0;font-size:20px;color:#153957}.attendance-total{margin:0;border-radius:16px;background:#153957;color:#fff;padding:8px 11px;font-size:12px;font-weight:900;line-height:1.5;text-align:center;white-space:nowrap}.attendance-total strong{font-size:17px}.attendance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.team-count{min-height:78px;padding:10px 12px;border:2px solid #d7e4ea;border-radius:16px;background:#f7fbfd;color:#334d5b;font-size:13px;font-weight:900}.team-name{display:block}.team-numbers{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;color:#6d7580;font-size:12px}.team-numbers strong{font-size:24px;color:#d43b35}.team-numbers b{font-size:17px;color:#153957}.team-count:last-child{grid-column:1/-1}.attendance-note{margin:12px 0 0;text-align:center;color:#6d7580;font-size:12px;font-weight:700}.reset{display:block;width:100%;min-height:48px;margin-top:14px;border:2px solid #c63042;border-radius:15px;background:#fff;color:#a92235;font-size:14px;font-weight:900;cursor:pointer}.reset:hover{background:#fff0f2}.reset:focus-visible{outline:4px solid #c6304233;outline-offset:2px}.privacy{text-align:center;margin:20px 0 0;font-size:12px;font-weight:800;color:#685a7a}@media(max-width:400px){.hero{height:205px;padding:22px}.mascot{width:178px}.hero h1{font-size:30px}.form{padding:22px}.time{margin:0 20px}.attendance{padding:17px}.attendance-grid{grid-template-columns:1fr}.team-count:last-child{grid-column:auto}}
    /* 高對比消防救災主視覺 */
    .b1{background:#ff7043}.b2{background:#1885a8}
    .card{box-shadow:0 24px 0 #15395729,0 34px 80px #15395738}
    .stripe{background:linear-gradient(90deg,#d62828,#ffb703,#146b8c,#d62828)}
    .hero{background:radial-gradient(circle at 20% 20%,#ffffff38 0 3px,transparent 4px),linear-gradient(135deg,#092f4f,#145b78 58%,#8f2435);background-size:27px 27px,auto}
    .mascot{width:190px;right:-20px;bottom:-58px;filter:drop-shadow(0 9px 3px #020b1280)}
    .status{border:3px solid #fff;background:#e64532;color:#fff;box-shadow:0 4px 0 #071e32}
    .eyebrow{font-size:15px;letter-spacing:.08em;color:#ffe08a;text-shadow:0 2px 3px #041b2d}
    .hero h1{font-size:36px;color:#fff;text-shadow:0 3px 0 #071e32,0 6px 18px #0009}
    .hero p{font-weight:900;color:#fff;text-shadow:0 2px 3px #041b2d}
    .submit{background:linear-gradient(90deg,#e64532,#c63042,#146b8c);box-shadow:0 8px 0 #153957,0 14px 28px #15395755}
    @media(max-width:400px){.mascot{width:168px;right:-18px;bottom:-47px}.hero h1{font-size:31px}}
  </style>
</head>
<body><main class="page"><i class="blob b1"></i><i class="blob b2"></i><section class="card"><div class="stripe"></div><header class="hero"><img class="mascot" src="public/0914-firefighter.png" alt="穿著紫色消防裝備的人員與救災黑貓"><div class="copy"><span class="status" id="status">正在確認時間</span><p class="eyebrow" id="eventName">914 緊急救護組</p><h1>現場報到</h1><p>填寫四項資料，快速完成簽到！</p></div></header><div class="time"><b>◷</b><span id="windowText">讀取活動時間中…<br>送出時自動記錄時間</span></div><form class="form" id="checkinForm" method="post"><label class="label" for="name">姓名</label><input class="input" id="name" name="name" autocomplete="name" required minlength="2" maxlength="40" placeholder="請輸入真實姓名"><fieldset style="border:0;padding:0;margin:0"><legend class="label">身分</legend><div class="roles"><label><input type="radio" name="role" value="教師" required><span>教師</span></label><label><input type="radio" name="role" value="職員" required><span>職員</span></label></div></fieldset><label class="label" for="team">編組</label><select class="team-select" id="team" name="team" required><option value="" selected disabled>請選擇所屬編組</option><option value="緊急救護組">緊急救護組</option><option value="安全防護組">安全防護組</option><option value="避難引導組">避難引導組</option><option value="通報組">通報組</option><option value="搶救組">搶救組</option></select><label class="label" for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com"><p class="hint">Email 僅用於辨識是否重複報到。</p><p class="notice" id="notice"></p><button class="submit" id="submitButton" type="submit" disabled>尚未連接 GAS</button></form></section><section class="attendance" aria-labelledby="attendanceTitle"><div class="attendance-head"><h2 id="attendanceTitle">各組現場報到</h2><p class="attendance-total">實到 <strong id="attendanceTotal">—</strong><br>應到 <strong id="attendanceExpected">197</strong></p></div><div class="attendance-grid" id="attendanceGrid" aria-live="polite"><div class="team-count"><span class="team-name">緊急救護組</span><span class="team-numbers">實到 <strong data-team="緊急救護組">—</strong><span>／應到 <b data-expected-team="緊急救護組">16</b></span></span></div><div class="team-count"><span class="team-name">安全防護組</span><span class="team-numbers">實到 <strong data-team="安全防護組">—</strong><span>／應到 <b data-expected-team="安全防護組">27</b></span></span></div><div class="team-count"><span class="team-name">避難引導組</span><span class="team-numbers">實到 <strong data-team="避難引導組">—</strong><span>／應到 <b data-expected-team="避難引導組">71</b></span></span></div><div class="team-count"><span class="team-name">通報組</span><span class="team-numbers">實到 <strong data-team="通報組">—</strong><span>／應到 <b data-expected-team="通報組">15</b></span></span></div><div class="team-count"><span class="team-name">搶救組</span><span class="team-numbers">實到 <strong data-team="搶救組">—</strong><span>／應到 <b data-expected-team="搶救組">68</b></span></span></div></div><p class="attendance-note" id="attendanceNote">正在讀取現場統計…</p><button class="reset" id="resetButton" type="button">🔒 清除實到人數</button></section><p class="privacy">個人資料僅供本次活動出席紀錄使用</p></main>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxF-eM8zsoHOawK9ASXhtYgF_QJOKzrWfmpmKfGcF_C2uBzXMIg4tmqgR6f8ieyj0bL-g/exec";
  const EXPECTED_COUNTS={'緊急救護組':16,'安全防護組':27,'避難引導組':71,'通報組':15,'搶救組':68};
  const form=document.getElementById('checkinForm'),button=document.getElementById('submitButton'),notice=document.getElementById('notice'),statusEl=document.getElementById('status');
  window.receiveCheckinConfig=function(c){if(!c.ok){showError(c.error||'無法讀取活動設定');return}document.getElementById('eventName').textContent=c.eventName;const start=new Date(c.startAt),end=new Date(c.endAt),server=new Date(c.serverTime);document.getElementById('windowText').innerHTML=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(start)+'－'+new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}).format(end)+'<br>送出時自動記錄時間';if(server<start){statusEl.textContent='報到尚未開始';button.textContent='報到尚未開始';button.disabled=true}else if(server>end){statusEl.textContent='報到已截止';button.textContent='報到已截止';button.disabled=true}else{statusEl.textContent='開放報到中';statusEl.style.background='#24c996';button.textContent='確認報到 ✦';button.disabled=false}};
  function showError(message){notice.textContent=message;notice.style.display='block';statusEl.textContent='尚未完成設定'}
  window.receiveCheckinCounts=function(c){const note=document.getElementById('attendanceNote');if(!c.ok||!c.counts){note.textContent='目前無法讀取報到人數';return}document.querySelectorAll('[data-team]').forEach(el=>{el.textContent=String(c.counts[el.dataset.team]||0)});document.querySelectorAll('[data-expected-team]').forEach(el=>{el.textContent=String((c.expected&&c.expected[el.dataset.expectedTeam])??EXPECTED_COUNTS[el.dataset.expectedTeam]??0)});document.getElementById('attendanceTotal').textContent=String(c.total||0);document.getElementById('attendanceExpected').textContent=String(c.totalExpected??197);note.textContent='每 15 秒自動更新｜'+new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(c.updatedAt))+' 更新'};
  function loadAttendanceCounts(){const old=document.getElementById('countsJsonp');if(old)old.remove();const s=document.createElement('script');s.id='countsJsonp';s.src=GAS_URL+'?action=counts&callback=receiveCheckinCounts&_='+Date.now();s.onerror=()=>{document.getElementById('attendanceNote').textContent='目前無法讀取報到人數'};document.head.appendChild(s)}
  document.getElementById('resetButton').addEventListener('click',function(){const password=window.prompt('請輸入指揮官密碼');if(password===null)return;if(!password){window.alert('尚未輸入密碼。');return}if(!window.confirm('確定要將各組實到人數歸零嗎？原始報到紀錄仍會保留。'))return;const resetForm=document.createElement('form');resetForm.method='post';resetForm.action=GAS_URL;resetForm.target='_blank';resetForm.style.display='none';[['action','resetCounts'],['password',password]].forEach(([name,value])=>{const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;resetForm.appendChild(input)});document.body.appendChild(resetForm);resetForm.submit();resetForm.remove();document.getElementById('attendanceNote').textContent='清除請求已送出，完成後將自動更新…';setTimeout(loadAttendanceCounts,2500);setTimeout(loadAttendanceCounts,5000)});
  if(GAS_URL.startsWith('https://script.google.com/macros/s/')){form.action=GAS_URL;const s=document.createElement('script');s.src=GAS_URL+'?callback=receiveCheckinConfig';s.onerror=()=>showError('無法連接 Google Apps Script');document.head.appendChild(s);loadAttendanceCounts();setInterval(loadAttendanceCounts,15000)}else showError('請先把 index.html 裡的 GAS_URL 換成 Apps Script 網頁應用程式網址。');
</script></body></html>
